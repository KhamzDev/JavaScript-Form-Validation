<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>

   <div class="container">
    <form>
        <img src="Images/plane.png" id="planeImg">

        <div class="input-group">
            <label>Name</label>
            <input type="text" placeholder="Enter name" id="nameInput">
            <span id="nameError"></span>
        </div>
        <div class="input-group">
            <label>Phone Num.</label>
            <input type="text" placeholder="ex: 0123562378" id="phoneInput">
            <span id="phoneError"></span>
        </div>
        <div class="input-group">
            <label>Email</label>
            <input type="text" placeholder="Enter email" id="emailInput">
            <span id="emailError"></span>
        </div>
        <div class="input-group">
            <label id="mLabel">Message</label>
            <input type="text" placeholder="Enter message" id="messageInput">
            <span id="messageError"></span>
        </div>

        <button id="submitBtn">Submit</button>
        <span id="submitError"></span>

    </form>
   </div>

<script src="index.js"></script>
</body>
</html>
